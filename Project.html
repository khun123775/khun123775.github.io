<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>My GitHub Page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Project</h1>

            My site is live And It feels nice to be here and create
            my portfolio for university.
        </p>
    </header>

    <nav>
        <a href="index.html">Home</a> |
        <a href="about.html">About Me</a> |
        <a href="contact.html">Contact</a> |
        <a href="Project.html">Project</a> |
        <a href="certificates.html">Certificates</a> |
    </nav>

    <main>

          <script>

    async function loadProjects() {

      const container = document.getElementById("project-list");

      try {

        const response = await fetch("File/Project.json");

        if (!response.ok) {

          throw new Error("Could not load Project.json");

        }

        const projects = await response.json();

        container.replaceChildren();

        projects.forEach(project => {

          const card = document.createElement("article");

          card.className = "project-card";

          const title = document.createElement("h2");

          title.textContent = project.title;

          const description = document.createElement("p");

          description.textContent = project.description;

          const status = document.createElement("p");

          status.textContent = `Status: ${project.status}`;

          card.append(title, description, status);

          container.appendChild(card);

        });

      } catch (error) {

        container.textContent =

          "Unable to load projects. Please check Project.json.";

        console.error(error);

      }

    }

    loadProjects();

  </script>

</body>

</html>
      
    </main>
</body>
</html>
